[package]
name = "orchard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JSON CLI and stdio MCP server for Apple pickup inventory"

[[bin]]
name = "orchard"
path = "src/main.rs"

[dependencies]
orchard-core = { path = "../orchard-core" }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
